<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<title>TimeSaver · Сервер панели</title>
<script>
(function () {  // mavzu: saqlangan tanlov > Windows sozlamasi
  let t = null;
  try { t = localStorage.getItem("ts-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    try { t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { t = "light"; }
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* ===== «Тун» dizayn tizimi (7-variant): yorug' — :root, qorong'i — [data-theme=dark] ===== */
:root{
  color-scheme:light;
  --page:#E7E5DD;--win:#F7F6F1;--side:#EFEDE6;--surface:#FFFFFF;--surface-2:#F1F0EA;
  --line:#E0DED4;--line-soft:#EAE8E0;--hi:rgba(255,255,255,0);
  --fg:#11163A;--fg-2:#41477A;--fg-3:#5D6294;
  --accent:#D4F06A;--accent-ink:#4D6400;--on-accent:#11163A;--accent-soft:#EEF8C9;--accent-line:#B9D64A;
  --ring:#1F2A6B;--on-ring:#FFFFFF;--ring-track:#E7E6DE;
  --warn:#FF9E7A;--warn-ink:#A8401A;--warn-soft:#FFEDE5;
  --good-ink:#1C7445;--good-soft:#E3F4EA;
  --danger:#C42136;--danger-soft:#FCEAEC;--on-danger:#FFFFFF;
  --info-ink:#2C5BBE;--info-soft:#E6EDFB;
  --nav-on-bg:#D4F06A;--nav-on-fg:#11163A;--nav-on-line:#B9D64A;
  --scrim:rgba(17,22,58,.38);
  --shadow:0 1px 2px rgba(17,22,58,.06),0 24px 56px -28px rgba(17,22,58,.28);
  --focus:#1F2A6B;
  --chart-1:#1F2A6B;--chart-2:#D9622F;--chart-3:#4D8A00;--chart-4:#2C5BBE;--chart-5:#8E5BD6;--chart-6:#5D6294;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --page:#070A1E;--win:#0E1333;--side:#0A0F2A;--surface:#141A42;--surface-2:#1B2254;
  --line:#252D63;--line-soft:#1D2453;--hi:rgba(255,255,255,.035);
  --fg:#EEF0FB;--fg-2:#B3B8DA;--fg-3:#8C93C2;
  --accent:#D4F06A;--accent-ink:#D4F06A;--on-accent:#11163A;--accent-soft:rgba(212,240,106,.11);--accent-line:rgba(212,240,106,.38);
  --ring:#D4F06A;--on-ring:#11163A;--ring-track:#232B5E;
  --warn:#FF9E7A;--warn-ink:#FF9E7A;--warn-soft:rgba(255,158,122,.13);
  --good-ink:#7FE0A8;--good-soft:rgba(127,224,168,.12);
  --danger:#FF6B78;--danger-soft:rgba(255,107,120,.14);--on-danger:#11163A;
  --info-ink:#8FB3FF;--info-soft:rgba(143,179,255,.13);
  --nav-on-bg:rgba(212,240,106,.11);--nav-on-fg:#D4F06A;--nav-on-line:rgba(212,240,106,.38);
  --scrim:rgba(0,0,0,.58);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 24px 60px -24px rgba(0,0,0,.6);
  --focus:#D4F06A;
  --chart-1:#D4F06A;--chart-2:#FF9E7A;--chart-3:#86ADFF;--chart-4:#7FE0A8;--chart-5:#C792EA;--chart-6:#B3B8DA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    color-scheme:dark;
    --page:#070A1E;--win:#0E1333;--side:#0A0F2A;--surface:#141A42;--surface-2:#1B2254;
    --line:#252D63;--line-soft:#1D2453;--hi:rgba(255,255,255,.035);
    --fg:#EEF0FB;--fg-2:#B3B8DA;--fg-3:#8C93C2;
    --accent:#D4F06A;--accent-ink:#D4F06A;--on-accent:#11163A;--accent-soft:rgba(212,240,106,.11);--accent-line:rgba(212,240,106,.38);
    --ring:#D4F06A;--on-ring:#11163A;--ring-track:#232B5E;
    --warn:#FF9E7A;--warn-ink:#FF9E7A;--warn-soft:rgba(255,158,122,.13);
    --good-ink:#7FE0A8;--good-soft:rgba(127,224,168,.12);
    --danger:#FF6B78;--danger-soft:rgba(255,107,120,.14);--on-danger:#11163A;
    --info-ink:#8FB3FF;--info-soft:rgba(143,179,255,.13);
    --nav-on-bg:rgba(212,240,106,.11);--nav-on-fg:#D4F06A;--nav-on-line:rgba(212,240,106,.38);
    --scrim:rgba(0,0,0,.58);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 24px 60px -24px rgba(0,0,0,.6);
    --focus:#D4F06A;
    --chart-1:#D4F06A;--chart-2:#FF9E7A;--chart-3:#86ADFF;--chart-4:#7FE0A8;--chart-5:#C792EA;--chart-6:#B3B8DA;
  }
}
:root{
  /* eski nomlar (JS ichidagi inline uslublar uchun) → yangi tokenlar */
  --bg:var(--win);--card:var(--surface);--card2:var(--surface-2);--tx:var(--fg);--mute:var(--fg-3);--soft:var(--fg-2);--hover:var(--surface-2);
  --accent-d:var(--accent-soft);--accent-tx:var(--on-accent);
  --green:var(--good-ink);--green-d:var(--good-soft);--amber:var(--warn-ink);--amber-d:var(--warn-soft);
  --blue:var(--info-ink);--blue-d:var(--info-soft);--red:var(--danger);--red-d:var(--danger-soft);
  --shade:var(--scrim);--inv:var(--fg);--inv-tx:var(--win);
  /* shrift: Onest, internet bo'lmasa — tizim shrifti */
  --font-ui:"Onest","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --fs-xs:11.5px;--fs-s:12.5px;--fs-m:13.5px;--fs-l:15px;--fs-h:22px;--fs-num:34px;
  --r-s:6px;--r-m:10px;--r-l:14px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--win);color:var(--fg);font-family:var(--font-ui);font-size:var(--fs-m);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--info-ink)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
code{font-family:var(--font-mono);font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.num,td,.bd,.stat-num,.sync-time,.met b{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{flex:none;fill:none;stroke:currentColor}

/* ---- chap menyu ---- */
body{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:12px 12px 12px;transition:width .18s}
.side .top{display:flex;align-items:center;gap:10px;padding:2px 2px 12px 6px;min-height:44px}
.side .top img{width:28px;height:28px;flex:none}
.side .top .nm{font-size:15px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.side .top .ib{margin-left:auto}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:none;color:var(--fg-2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:var(--surface);color:var(--fg);border-color:var(--line)}
.sbtn{display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--fg-2);font-size:var(--fs-m);font-weight:500;text-align:left;width:100%;white-space:nowrap}
.sbtn:hover{background:var(--surface);color:var(--fg)}
.sbtn.on{background:var(--nav-on-bg);border-color:var(--nav-on-line);color:var(--nav-on-fg);font-weight:600}
.sbtn svg{flex:none}
.sbtn .lbl{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sbtn .bd{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;font-size:11px;font-weight:600;line-height:1;background:var(--danger);color:var(--on-danger)}
.sbtn .bd.g{background:var(--good-soft);color:var(--good-ink)}
.sbtn .bd.a{background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.sbtn.new{border-color:var(--line);background:var(--surface);color:var(--fg);font-weight:600;margin-bottom:6px}
.sbtn.new svg{color:var(--accent-ink)}
.sbtn.new:hover{border-color:var(--accent-line)}
.sbtn.new .tm{flex:none;font-weight:500;font-size:var(--fs-xs);color:var(--fg-3)}
.sbtn.new.busy svg{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sgrp{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);padding:18px 10px 6px;white-space:nowrap}
.side .scroll{flex:1;overflow:auto;margin:0 -4px;padding:2px 4px;display:flex;flex-direction:column;gap:2px}
.side .foot{margin-top:10px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:8px;display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:9px;background:#1F2A6B;color:#D4F06A;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.02em;flex:none}
.who{flex:1;min-width:0;line-height:1.3}
.who b{display:block;font-size:var(--fs-s);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who #alive{font-size:var(--fs-xs);color:var(--fg-3);display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .ib{width:30px;height:30px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good-ink);margin-right:6px;flex:none}
.dot.bad,.dot.crit{background:var(--danger)}.dot.warn{background:var(--warn)}
body.mini .side{width:66px}
body.mini .side .lbl,body.mini .side .nm,body.mini .side .sgrp,body.mini .side .who,body.mini .side .bd,body.mini .side .tm,body.mini .side .foot .ib.th{display:none}
body.mini .side .top{flex-direction:column;padding:2px 0 10px}
body.mini .side .top .ib{margin:6px 0 0}
body.mini .sbtn{justify-content:center;padding:0}
body.mini .side .foot{flex-direction:column;padding:6px 0;border-color:transparent;background:none}
.main{flex:1;min-width:0;background:var(--win)}
.mbar{display:none;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-soft);background:var(--side);position:sticky;top:0;z-index:5}
.mbar img{width:26px;height:26px}.mbar b{font-size:15px}
.sshade{display:none}
@media(max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s;width:264px}
  body.open .side{transform:none}
  body.open .sshade{display:block;position:fixed;inset:0;background:var(--scrim);z-index:19}
  .mbar{display:flex}
  .side .top .ib.col{display:none}
  body.mini .side{width:264px}
}

/* ---- umumiy ---- */
.wrap{max-width:1320px;margin:0 auto;padding:22px 28px 44px;container-type:inline-size}
@media(max-width:640px){.wrap{padding:16px 16px 36px}}
h2{font-size:var(--fs-h);margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--fg-3);font-size:var(--fs-s);margin-bottom:18px}
.eyebrow{font-size:var(--fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:inset 0 1px 0 var(--hi);min-width:0}
.row{display:flex;gap:16px}
.btn{height:38px;padding:0 14px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:var(--fs-m);font-weight:600;white-space:nowrap;
  border:1px solid var(--line);background:var(--surface-2);color:var(--fg);text-decoration:none}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent-line)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.big{height:46px;padding:0 26px;font-size:var(--fs-l)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{height:32px;padding:0 12px;font-size:var(--fs-s);border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg.i{width:16px;height:16px}
.steps{display:flex;flex-direction:column;gap:5px;font-size:var(--fs-s)}
.steps div{display:flex;justify-content:space-between;gap:16px}
.steps .m{color:var(--fg-3)}.steps .w{color:var(--warn-ink)}.steps .e{color:var(--danger)}
.bar{height:6px;border-radius:3px;background:var(--ring-track);overflow:hidden;margin:10px 0 12px}
.bar>div,.bar>i{display:block;height:100%;border-radius:3px;background:var(--ring);transition:width .4s}
.msg-ok{color:var(--good-ink)}.msg-err{color:var(--danger)}
.empty{padding:36px;text-align:center;color:var(--fg-3)}

/* ---- bosh sahifa ---- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.head h1{margin:4px 0 0;font-size:var(--fs-h);font-weight:600;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:var(--fs-s);color:var(--fg-2);font-weight:500;white-space:nowrap}
.notice{padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;line-height:1.55}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink)}
.notice.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.notice a{color:inherit;font-weight:700}
.row-a,.row-b{display:grid;grid-template-columns:332px minmax(0,1fr);gap:16px}
.row-b{margin-top:16px;align-items:stretch}
.sync{padding:18px;display:flex;flex-direction:column;gap:14px}
.sync-top{display:flex;align-items:center;gap:14px}
.ring{position:relative;flex:none}
.ring>svg{display:block;transform:rotate(-90deg)}
.ring .track{stroke:var(--ring-track);fill:none}
.ring .val{stroke:var(--ring);fill:none;stroke-linecap:round;transition:stroke-dasharray .5s}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;color:var(--ring);font-size:13px;font-weight:600}
.sync-time{font-size:var(--fs-num);font-weight:600;letter-spacing:-.02em;line-height:1;margin-top:6px}
.sync-text{margin-top:6px;color:var(--fg-2);font-size:var(--fs-s)}
.sync-text b{color:var(--fg);font-weight:600}
.sync-note{font-size:var(--fs-s);color:var(--fg-2);line-height:1.5}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn.primary{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{padding:14px 14px 15px;display:flex;flex-direction:column;gap:8px;justify-content:space-between;cursor:pointer;transition:border-color .15s;text-align:left}
.stat:hover{border-color:var(--fg-3)}
.stat.alert{border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.stat.alert:hover{border-color:var(--danger)}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.stat-label{font-size:var(--fs-s);color:var(--fg-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:1px}
.stat-hint{font-size:var(--fs-xs);color:var(--fg-3);white-space:nowrap}
.stat-num{display:flex;align-items:baseline;gap:6px;white-space:nowrap;min-width:0}
.stat-num b{font-size:var(--fs-num);font-weight:600;letter-spacing:-.02em;line-height:1}
.stat-num span{font-size:var(--fs-s);color:var(--fg-3)}
.stat .spark{width:100%;height:36px;display:block;overflow:visible}
.spark-wait{height:36px;display:flex;align-items:center;border-top:1px dashed var(--line);font-size:var(--fs-xs);color:var(--fg-3)}
.stat-foot{font-size:var(--fs-s);color:var(--fg-3);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta{font-weight:700;color:var(--fg-2)}
.delta.up-good,.delta.down-good{color:var(--accent-ink)}
.delta.up-bad,.delta.down-bad{color:var(--warn-ink)}
.delta.crit{color:var(--danger)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-title{display:flex;align-items:center;gap:8px;font-size:var(--fs-l);font-weight:600;margin:0}
.card-sub{margin-top:3px;font-size:var(--fs-s);color:var(--fg-3)}
.link{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;color:var(--fg-2);font-size:var(--fs-s);font-weight:600;background:transparent;border:1px solid transparent}
.link:hover{background:var(--surface-2);color:var(--fg)}
.move,.quick{display:flex;flex-direction:column}
.move-total{margin:12px 18px 2px;padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line-soft)}
.mt-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mt-row span{font-size:var(--fs-s);color:var(--fg-2)}
.mt-row>b{font-size:22px;font-weight:600;letter-spacing:-.01em}
.move-total .bar{margin:9px 0 0}
.branches{list-style:none;margin:0;padding:6px 8px;display:flex;flex-direction:column;flex:1}
.branch{display:grid;grid-template-columns:54px minmax(0,1fr) 16px;align-items:center;gap:14px;padding:10px;border-radius:var(--r-m);cursor:pointer;border:0;background:none;width:100%;text-align:left}
.branch+.branch{border-top:1px solid var(--line-soft)}
.branch:hover{background:var(--surface-2)}
.br-name{font-size:var(--fs-m);font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-meta{margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.br-meta small{font-size:var(--fs-xs);color:var(--fg-3)}
.chev{color:var(--fg-3)}
.card-foot{padding:4px 10px 12px}
.tchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tchip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.tchip.good{background:var(--good-soft);color:var(--good-ink)}
.tchip.bad{background:var(--danger-soft);color:var(--danger)}
.tchip.neutral{background:var(--surface-2);color:var(--fg-2)}
.qlist{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;flex:1}
.qitem{display:grid;grid-template-columns:36px minmax(0,1fr) 16px;gap:12px;align-items:center;padding:10px;border-radius:var(--r-m);border:0;background:none;width:100%;text-align:left;color:inherit}
.qitem+.qitem{border-top:1px solid var(--line-soft)}
.qitem:hover{background:var(--surface-2)}
.qitem b{display:block;font-size:var(--fs-m);font-weight:600}
.qitem small{display:block;font-size:var(--fs-s);color:var(--fg-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line-soft)}
.qfoot{padding:10px 18px 14px;border-top:1px solid var(--line-soft);font-size:var(--fs-s);color:var(--fg-3);word-break:break-word}
/* bosh sahifa: Срок / 30+ кун · ABC */
.row-b{grid-template-columns:332px minmax(0,1fr)}
.sabc .card-head{flex-wrap:wrap}
.sabc-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sabc-fil{height:38px;max-width:200px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;font-size:var(--fs-s)}
.sabc-cls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 18px 6px}
.sabc-c{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface-2);color:inherit;text-align:left;cursor:pointer}
.sabc-c:hover{border-color:var(--fg-3)}
.sabc-c.on{border-color:var(--accent-line);background:var(--accent-soft)}
.sabc-c[disabled]{opacity:.45;cursor:default}
.sabc-cm{min-width:0;display:flex;flex-direction:column;gap:6px}

.ktop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 384px;gap:12px}
.grp{padding:14px 14px 13px;display:flex;flex-direction:column;justify-content:space-between;gap:9px}
.grp.a{border-color:var(--accent-line)}
.grp-top{display:flex;align-items:center;gap:10px;min-width:0}
.letter{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:18px;font-weight:700;line-height:1;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line-soft)}
.letter.a{background:var(--accent);color:var(--on-accent);border-color:var(--accent-line)}
.letter.sm{width:24px;height:24px;border-radius:6px;font-size:12.5px}
.grp-sum{min-width:0}
.grp-sum b{display:block;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.15;white-space:nowrap}
.grp-sum small{font-size:var(--fs-xs);color:var(--fg-3);white-space:nowrap}
.pct-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pct-row b{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.pct-row span{font-size:var(--fs-xs);color:var(--fg-3);white-space:nowrap}
.split{display:flex;gap:2px;height:8px}
.split i{display:block;height:100%;border-radius:3px;min-width:4px}
.split .ok{background:var(--ring)}.split .no{background:var(--warn)}.split .nil{background:var(--ring-track)}
.lgd{display:flex;flex-direction:column;gap:4px}
.lg{display:flex;align-items:center;gap:7px;font-size:var(--fs-s);color:var(--fg-2);white-space:nowrap;height:22px;padding:0 6px;margin:0 -6px;border-radius:6px}
.lg .swc{width:8px;height:8px;border-radius:2px;flex:none}
.lg .swc.ok{background:var(--ring)}.lg .swc.no{background:var(--warn)}
.lg .ic-ok{color:var(--good-ink);display:inline-flex}.lg .ic-no{color:var(--warn-ink);display:inline-flex}
.lg b{color:var(--fg);font-weight:600}
.lg em{font-style:normal;margin-left:auto;color:var(--fg-2)}
.lg.hot{background:var(--warn-soft);color:var(--warn-ink)}.lg.hot b,.lg.hot em{color:var(--warn-ink)}
.mx{display:flex;flex-direction:column;padding-bottom:6px}
.mx .card-head{padding:13px 16px 0;align-items:baseline}
.mx .card-sub{margin:0;font-size:var(--fs-xs)}
.mx-tbl{width:100%;border-collapse:collapse;margin-top:6px;table-layout:fixed}
.mx-tbl th{padding:5px 4px;font-size:10.5px;text-align:center;background:none}
.mx-tbl th:first-child{text-align:left;padding-left:16px;width:40%}
.mx-tbl th:last-child,.mx-tbl td:last-child{border-left:1px solid var(--line-soft)}
.mx-tbl td{height:27px;padding:0 4px;font-size:var(--fs-s);text-align:center}
.mx-tbl td.br{text-align:left;padding-left:16px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-tbl tr.tot td{border-top:1px solid var(--line);border-bottom:0}
.mx-tbl tr.tot td.br{color:var(--fg-2);letter-spacing:.06em;text-transform:uppercase;font-size:10.5px}
.cell{display:inline-flex;flex-direction:column;gap:3px;width:46px;max-width:100%;vertical-align:middle}
.cell b{font-weight:600;font-size:12px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.cell .bar{height:3px;margin:0}
.cell.low b{color:var(--danger)}.cell.low .bar i{background:var(--danger)}
.cell.nil{color:var(--fg-3)}
.tot .cell b{font-weight:700}
.klists{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.kcol{display:flex;flex-direction:column;overflow:hidden}
.kcol-head{display:flex;align-items:center;gap:11px;padding:11px 16px 10px;border-bottom:1px solid var(--line-soft)}
.ico.good{background:var(--good-soft);color:var(--good-ink);border-color:transparent;width:30px;height:30px;border-radius:8px}
.ico.warn{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent;width:30px;height:30px;border-radius:8px}
.col-title{margin:0;font-size:var(--fs-l);font-weight:600;line-height:1.2}
.col-sub{font-size:var(--fs-xs);color:var(--fg-3)}
.col-total{margin-left:auto;text-align:right;white-space:nowrap}
.col-total b{display:block;font-size:var(--fs-l);font-weight:600}
.col-total small{font-size:var(--fs-xs);color:var(--fg-3)}
.kcol-body{max-height:640px;overflow-y:auto;padding:4px 8px 10px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.kcol-body .empty{padding:28px 12px}
.ksec+.ksec{margin-top:8px}
.ksec-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:9px;padding:8px 8px 6px;background:var(--surface)}
.ksec-head .t{font-size:var(--fs-m);font-weight:600}
.ksec-head .m{margin-left:auto;font-size:var(--fs-s);color:var(--fg-2);white-space:nowrap}
.ksec-head .m b{color:var(--fg);font-weight:600}
.krows{list-style:none;margin:0;padding:0}
.kr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:3px 12px;padding:7px 8px;border-radius:8px}
.kr+.kr{border-top:1px solid var(--line-soft)}
.kr:hover{background:var(--surface-2)}
.kr:hover+.kr{border-top-color:transparent}
.kr .r-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr .r-sum{justify-self:end;font-weight:600;white-space:nowrap}
.kr .r-sum em{font-style:normal;font-weight:500;color:var(--fg-3);font-size:var(--fs-xs);margin-left:4px}
.kr .r-sum .q{color:var(--fg-3);font-weight:500;font-size:var(--fs-xs);margin-right:10px}
.kr .r-route{display:flex;align-items:center;gap:5px;min-width:0;font-size:var(--fs-xs);color:var(--fg-3);white-space:nowrap;overflow:hidden;letter-spacing:.01em}
.kr .r-route .sep{opacity:.6}
.kr .tchip{justify-self:end;height:20px;font-size:11px;padding:0 7px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.tchip.flag{background:var(--danger);color:var(--on-danger);height:20px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.more{display:inline-flex;align-items:center;gap:4px;height:26px;margin:2px 0 0 8px;padding:0 6px;border-radius:6px;background:transparent;border:0;color:var(--fg-2);font-size:var(--fs-s);font-weight:600}
.more:hover{background:var(--surface-2);color:var(--fg)}
.ksec.hot{--hot-bg:color-mix(in srgb,var(--warn) 12%,var(--surface));background:var(--hot-bg);border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line));border-radius:var(--r-m);padding:0 4px 4px;margin-top:4px}
.ksec.hot .ksec-head{background:var(--hot-bg);border-radius:var(--r-m) var(--r-m) 0 0;padding-top:9px}
.ksec.hot .kr{box-shadow:inset 3px 0 0 var(--danger);border-radius:0 8px 8px 0;padding-left:12px}
.ksec.hot .kr+.kr{border-top-color:color-mix(in srgb,var(--danger) 18%,transparent)}
.ksec.hot .kr:hover{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.ksec.hot .r-name{font-weight:600}
@container (max-width:1180px){.ktop{grid-template-columns:repeat(3,minmax(0,1fr))}.ktop .mx{grid-column:1/-1}.mx-tbl th:first-child{width:34%}}
@container (max-width:760px){.ktop,.klists{grid-template-columns:minmax(0,1fr)}}
/* ---- buyurtma so'rovlari (drawer) ---- */
.oq-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.oq-item.done{background:var(--surface-2);border-color:var(--line-soft)}
.oq-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.oq-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.oq-btns .btn{height:30px;padding:0 10px;font-size:var(--fs-s);border-radius:8px}
.oq-btns .qin{width:64px;height:30px}
.oq-foot{position:sticky;bottom:-24px;background:var(--surface);padding:14px 0 18px;border-top:1px solid var(--line);margin-top:16px}
.arow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.arow.off{opacity:.6}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="top">
    <img src="/logo.svg" alt=""><span class="nm">TimeSaver</span>
    <button class="ib col" id="colBtn" title="Менюни йиғиш" aria-label="Менюни йиғиш" onclick="toggleMini()"></button>
  </div>
  <button class="sbtn new" id="refBtn" onclick="doRefresh()" title="Excel маълумотини янгилаш"></button>
  <nav class="scroll" id="sideNav" aria-label="Асосий меню"></nav>
  <div class="foot">
    <div class="avatar" id="av" aria-hidden="true">T</div>
    <div class="who"><b id="phName">TimeSaver</b><span id="alive"><i class="dot"></i><span>…</span></span></div>
    <button class="ib th" id="thBtn" title="Ёруғ / қоронғи мавзу" aria-label="Мавзуни алмаштириш" onclick="toggleTheme()"></button>
    <button class="ib" id="setBtn" title="Созламалар" aria-label="Созламалар" onclick="go('set')"></button>
  </div>
</aside>
<div class="sshade" onclick="document.body.classList.remove('open')"></div>
<div class="main">
  <div class="mbar"><button class="ib" id="menuBtn" aria-label="Меню" onclick="document.body.classList.add('open')"></button><img src="/logo.svg" alt=""><b>TimeSaver</b><span class="date" id="today" style="margin-left:auto;font-size:var(--fs-s);color:var(--fg-3)"></span></div>
  <div class="wrap"><main id="view"></main></div>
</div>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-label="Тафсилотлар"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SHEETS = ["Sale","Srok","30+ kun","Narx","Hisob"];   // Excel varaq nomlari (server kalitlari) — o'zgartirilmaydi
const SHEET_LBL = {"Sale":"Сотув", "Srok":"Срок", "30+ kun":"30+ кун", "Narx":"Нархлар", "Hisob":"Ҳисоб"};
const WD = ["Якшанба", "Душанба", "Сешанба", "Чоршанба", "Пайшанба", "Жума", "Шанба"];
const MON = ["январ", "феврал", "март", "апрел", "май", "июн", "июл", "август", "сентябр", "октябр", "ноябр", "декабр"];
const reducedMotion = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
let S = null;          // so'nggi holat
let view = "home";
let vsub = "";         // bo'lim ichidagi yorliq: #koch/abc, #order/sorov
let timer = null;
let usersFilter = "", usersQuery = "";
let tagList = [];

async function api(path, body) {
  const opt = body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json","X-Requested-With":"panel"}, body:JSON.stringify(body)};
  const r = await fetch(path, opt);
  return r.json();
}
function toast(t, err) {
  const el = $("#toast"); el.textContent = t; el.className = "toast" + (err ? " err" : ""); el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", err ? 6000 : 3000);
}

/* ---------- ikonkalar (chiziqli, 24x24) ---------- */
const IC = {
  home: '<path d="M4 10.5 12 4l8 6.5"/><path d="M6 9v10h4.5v-5h3v5H18V9"/>',
  refresh: '<path d="M19.5 12a7.5 7.5 0 0 1-13 5.1"/><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1"/><path d="M17.5 3.5v3.4h-3.4"/><path d="M6.5 20.5v-3.4h3.4"/>',
  koch: '<path d="M4 8h13"/><path d="m14 4.5 3.5 3.5L14 11.5"/><path d="M20 16H7"/><path d="m10 12.5-3.5 3.5 3.5 3.5"/>',
  sklad: '<path d="M4 7.5 12 4l8 3.5v9L12 20l-8-3.5z"/><path d="M4 7.5 12 11l8-3.5"/><path d="M12 11v9"/>',
  order: '<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 4v2h6V4"/><path d="M8.5 11h7M8.5 15h4.5"/>',
  users: '<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8"/><path d="M15.5 5.6a3 3 0 0 1 0 5.8"/><path d="M17.2 14.4c1.8.5 3 2 3.3 4.6"/>',
  reports: '<path d="M14 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M14 4v5h5"/><path d="M9 16v-3M12 16v-5M15 16v-2"/>',
  bc: '<path d="M20 4 4 10.5l6.5 2.5L13 19.5z"/><path d="m10.5 13 4.5-4.5"/>',
  stats: '<path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/>',
  log: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.4"/>',
  set: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  wizard: '<path d="m4 20 11-11"/><path d="m13 7 2-2 4 4-2 2"/><path d="M18 3v2M21 6h-2M7 4v2M8 5H6M19 15v2M20 16h-2"/>',
  tool: '<path d="M14.5 6.5a4 4 0 0 0 4.8 4.8L20 12l-8 8-3.5-3.5 8-8"/><path d="M14.5 6.5 16 5l3 3-1.5 1.5"/><path d="m4 20 4.5-4.5"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
  alert: '<path d="M12 4 3 19.5h18z"/><path d="M12 10v4.2M12 17h.01"/>',
  chev: '<path d="m9.5 6 6 6-6 6"/>',
  arrow: '<path d="M5 12h14M13.5 6.5 19 12l-5.5 5.5"/>',
  side: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.5 4v16"/>',
  moon: '<path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/>',
  sun: '<circle cx="12" cy="12" r="3.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  x: '<path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>',
  ban: '<circle cx="12" cy="12" r="8"/><path d="m6.4 6.4 11.2 11.2"/>',
  lock: '<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',
  bell: '<path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2H5z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  download: '<path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/>',
  info: '<circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/>',
};
function ico(n, s = 18, w = 1.6) {
  return `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ""}</svg>`;
}
const NAV = [
  ["", [["home", "Бош саҳифа"], ["koch", "Кўчириш"], ["sklad", "Склад"], ["order", "Буюртма"]]],
  ["Мижозлар", [["users", "Фойдаланувчилар"], ["bc", "Хабар юбориш"], ["reports", "Ҳисоботлар"]]],
  ["Тизим", [["stats", "Статистика"], ["log", "Журнал"], ["set", "Созламалар"], ["setup", "Созлаш устаси"]]],
];
function badge(v) {
  if (!S) return "";
  if (v === "users" && S.pending) return `<span class="bd">${S.pending}</span>`;
  if (v === "koch" && S.koch && S.koch.has) return `<span class="bd ${S.koch.late ? "" : S.koch.pct >= 90 ? "g" : "a"}">${S.koch.late ? S.koch.late + " кеч" : S.koch.pct + "%"}</span>`;
  if (v === "order" && S.oreq_pending) return `<span class="bd" title="Кутаётган буюртма сўровлари">${S.oreq_pending}</span>`;
  if (v === "set" && (!S.token_ok || S.no_admins)) return `<span class="bd">!</span>`;
  return "";
}
function renderSide() {
  $("#sideNav").innerHTML = NAV.map(([g, items]) => (g ? `<div class="sgrp">${g}</div>` : "") + items.map(([v, l]) =>
    `<button class="sbtn ${view === v ? "on" : ""}" ${view === v ? 'aria-current="page"' : ""} onclick="go('${v}')" title="${l}">${ico(v === "setup" ? "wizard" : v)}<span class="lbl">${l}</span>${badge(v)}</button>`).join("")).join("");
  const busy = S && S.refresh.running;
  const rb = $("#refBtn");
  rb.className = "sbtn new" + (busy ? " busy" : "");
  rb.innerHTML = ico("refresh") + `<span class="lbl">${busy ? "Янгиланмоқда…" : "Янгилаш"}</span>` +
    (S && !busy ? `<span class="tm">${esc(S.when_hm)}</span>` : "");
}
function themeIcon() {
  const dark = document.documentElement.dataset.theme === "dark";
  const b = $("#thBtn"); b.innerHTML = ico(dark ? "sun" : "moon", 18);
  b.title = dark ? "Ёруғ мавзуга ўтиш" : "Қоронғи мавзуга ўтиш"; b.setAttribute("aria-label", b.title);
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("ts-theme", t); } catch (e) {}
  themeIcon();
  route();
}
function toggleMini() {
  document.body.classList.toggle("mini");
  try { localStorage.setItem("ts-mini", document.body.classList.contains("mini") ? "1" : ""); } catch (e) {}
  if (view === "home") drawSparks();
}
let SETUP = null;
function applyName(n) {
  const name = (n || "").trim() || "TimeSaver";
  $("#phName").textContent = name;
  const words = name.split(/\s+/).map(w => w.replace(/^[^\p{L}\d]+/u, "")).filter(Boolean);
  $("#av").textContent = (words.length > 1 ? words[0].charAt(0) + words[1].charAt(0) : (words[0] || "T").charAt(0)).toUpperCase() || "T";
  document.title = (n ? name + " · " : "") + "TimeSaver";
}

/* ---------- holat va marshrut ---------- */
async function loadState() {
  try { S = await api("/api/state"); } catch (e) { S = null; }
  const a = $("#alive");
  if (!S) { a.innerHTML = '<i class="dot bad"></i>Панел жавоб бермаяпти'; schedule(); return; }
  a.innerHTML = S.alive ? '<i class="dot"></i>Бот ишлаяпти' : "<i class=\"dot bad\"></i>Telegram'га уланмаган";
  $("#today").textContent = S.today;
  renderSide();
  if (view === "home") renderHome();
  if (view === "bc") renderBcProgress();
  schedule();
}
function schedule() {
  clearTimeout(timer);
  const busy = S && (S.refresh.running || S.bc.running);
  timer = setTimeout(loadState, busy ? 1500 : 10000);
}
function go(v) { location.hash = v; }
window.addEventListener("hashchange", route);
function route() {
  const h = ((location.hash || "#home").slice(1) || "home").split("/");
  view = h[0] || "home"; vsub = h[1] || "";
  closeDrawer();
  document.body.classList.remove("open");
  if (SETUP && !SETUP.done && view !== "setup") view = "setup";
  document.body.classList.toggle("wiz", view === "setup");

function renderBcProgress() {
  const el = $("#bcprog"); if (!el || !S) return;
  const b = S.bc;
  if (!b.kind) { el.innerHTML = ""; return; }

  el.innerHTML = `<div class="card" style="padding:16px 20px;margin-bottom:16px" aria-live="polite"><b>${b.running ? "Юборилмоқда…" : "Юбориш тугади"}</b>

          <div class="hint" style="margin:2px 0 0">${skNum(it.sales[d])} · ${skNum(it.stock[d])} · <b>${it.need[d]}</b></div></td>`).join("")}

function kirToggle(j) { if (!KIR) return; KIR.open.has(j) ? KIR.open.delete(j) : KIR.open.add(j); kirCalc(); }
function kirList(j) {
  const k = KIR, d = k.dst[j];
  const rows = k.items.map((it, i) => ({it, v: kirVal(i, j)})).filter(x => x.v > 0);
  if (!rows.length) return '<div class="hint" style="margin:0">Бу дорихонага дори тақсимланмаган</div>';
  return `<table style="width:100%"><thead><tr><th>Дори</th><th>Сони</th><th>Муддат</th><th>Эҳтиёж</th><th>Сотув · қолдиқ</th></tr></thead><tbody>` +
    rows.map(({it, v}) => `<tr><td>${esc(it.name)}<div class="hint" style="margin:0">${esc(it.producer)}</div></td><td><b>${skNum(v)}</b></td>
      <td>${esc(it.exp)}</td><td>${it.need[d]}</td><td>${skNum(it.sales[d])} · ${skNum(it.stock[d])}</td></tr>`).join("") + "</tbody></table>";
}
function kirVal(i, j) { const e = $("#ki_" + i + "_" + j); const v = Number(e && e.value || 0); return v > 0 ? v : 0; }
function kirCalc() {
  const k = KIR; if (!k || !k.items) return true;
  let ok = true, left = 0, bad = 0;
  const tot = k.dst.map(() => 0), cnt = k.dst.map(() => 0);
  k.items.forEach((it, i) => {
    let used = 0;
    k.dst.forEach((d, j) => { const v = kirVal(i, j); used += v; tot[j] += v; if (v > 0) cnt[j]++; });
    if (it.avail - used < 0) bad++;
    const l = it.avail - used, c = $("#kl_" + i);
    if (l < 0) ok = false;
    left += l;
    if (c) c.innerHTML = `<b style="color:${l < 0 ? "var(--danger)" : "inherit"}">${skNum(l)}</b>`;
  });
  k.dst.forEach((d, j) => { const c = $("#kt_" + j); if (c) c.innerHTML = `<b>${skNum(tot[j])}</b>`; });
  const c = $("#kt_left"); if (c) c.innerHTML = `<b>${skNum(left)}</b>`;
  const sm = $("#kirsum");
  if (sm) sm.innerHTML = `<div class="tbl"><table><thead><tr><th>Дорихона</th><th>Дори</th><th>Қадоқ</th><th></th></tr></thead><tbody>
      ${k.dst.map((d, j) => `<tr><td><button class="link" style="padding:0 4px;margin-left:-4px;color:var(--fg);font-size:var(--fs-m)" aria-expanded="${KIR.open.has(j)}" onclick="kirToggle(${j})" title="Дорилар рўйхати">${KIR.open.has(j) ? "▼" : "▶"} ${esc(d)}</button></td><td>${cnt[j]}</td><td>${skNum(tot[j])}</td>
        <td style="text-align:right">${cnt[j] ? `<button class="btn" ${ok ? "" : "disabled"} onclick="kirCreate(${j})">📤 Брон яратиш</button>` : ""}</td></tr>
        ${KIR.open.has(j) ? `<tr><td colspan="4" style="padding:0 14px 14px">${kirList(j)}</td></tr>` : ""}`).join("")}
      <tr><td><b>Складда қолади</b></td><td></td><td><b style="color:${left < 0 ? "var(--danger)" : "inherit"}">${skNum(left)}</b></td><td></td></tr></tbody></table></div>
    ${bad ? `<div class="hint" style="margin:6px 0 0;color:var(--danger)">⚠ ${bad} та дори келганидан кўп тақсимланган — рўйхатни очиб тузатинг</div>` : ""}`;
  const b = $("#kirbtn"); if (b) b.disabled = !ok;
  return ok;
}
async function kirCreate(only) {
  const k = KIR; if (!k || !k.items) return;
  if (!kirCalc()) return toast("Баъзи дорилар келганидан кўп тақсимланган (қизил)", true);
  const alloc = {}, lines = [];
  k.dst.forEach((d, j) => {
    if (only !== undefined && j !== only) return;
    let n = 0, q = 0;
    k.items.forEach((it, i) => { const v = kirVal(i, j); if (v > 0) { if (v !== Math.floor(v)) return; (alloc[d] = alloc[d] || {})[i] = v; n++; q += v; } });
    if (n) lines.push(`→ ${d}: ${n} та дори, ${skNum(q)} қадоқ`);
  });
  if (!lines.length) return toast("Тақсимотда дори йўқ", true);
  if (!confirm(`Кирим тақсимоти бўйича FOM брон яратилсинми?\n\nБаза: ${k.db}\nСана: ${k.sana}\n\n${lines.join("\n")}\n\nҲар дорихона учун FOM'да ҚОРАЛАМА (ўтказиш — FOM дастурида).`)) return;
  toast("FOM'га ёзилмоқда…");
  const r = await api("/api/kirim/create", {sana:k.sana, alloc, sig:k.sig});
  toast(r.ok ? r.msg : r.error, !r.ok);

}

/* Fayl yuklab olish (Excel): xato bo'lsa — JSON xabar toast'da, sahifa almashmaydi */
async function dlFile(url) {
  let r;
  try { r = await fetch(url); } catch (e) { return toast("Панел жавоб бермаяпти", true); }
  if (!r.ok || (r.headers.get("Content-Type") || "").includes("json")) {
    let e = "Файлни олиб бўлмади"; try { e = (await r.json()).error || e; } catch (x) {}
    return toast(e, true);
  }
  const blob = await r.blob(), a = document.createElement("a");
  const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(r.headers.get("Content-Disposition") || "");
  a.href = URL.createObjectURL(blob); a.download = m ? decodeURIComponent(m[1]) : "TimeSaver.xlsx";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* Klaviatura: ↑ ↓ (PageUp/PageDown — 5 ta, Home/End) — firmalar orasida. Miqdor kataklarida ishlamaydi. */
document.addEventListener("keydown", e => {
  if (view !== "order" || vsub || !O.shown || !O.shown.length || e.ctrlKey || e.altKey || e.metaKey) return;
  const t = e.target, tag = (t && t.tagName) || "";
  if ((tag === "INPUT" && t.id !== "oq") || tag === "TEXTAREA" || tag === "SELECT") return;
  const step = {ArrowDown: 1, ArrowUp: -1, PageDown: 5, PageUp: -5}[e.key];
  const n = O.shown.length, cur = Math.max(0, O.shown.indexOf(O.sel));
  let i;
  if (step !== undefined) i = Math.min(n - 1, Math.max(0, cur + step));
  else if (e.key === "Home" && tag !== "INPUT") i = 0;
  else if (e.key === "End" && tag !== "INPUT") i = n - 1;
  else return;
  e.preventDefault();
  if (i === cur && O.sel === O.shown[i]) return;
  O.sel = O.shown[i]; O.ask = false;
  document.querySelectorAll(".olist .sp[data-f]").forEach(el => {
    const on = el.dataset.f === O.sel;

// 4 qadam: Bot (token + admin) → Ma'lumot (SQL + Excel) → Sinov → Tayyor
const WSTEPS = ["Бот", "Маълумот", "Синов", "Тайёр"];
const TOKEN_RE = /^\d{6,}:[A-Za-z0-9_-]{30,}$/;
let wstep = 0, wtimer = null, wbusy = false, wsig = "";

let wsql = null, wsqlBusy = false;                                // SQL: avtomatik qidiruv / tekshiruv natijasi
let wsf = {server: "", db: "", uid: "", pwd: "", dbs: [], init: false};  // SQL formasi (qayta chizilganda yo'qolmasin)
let wnm = {name: null, sklad: null};
let wxErr = null;                                                 // Excel yuklash/ulash xatosi (doimiy ko'rinadi)                              // 1-qadam: dorixona / sklad nomi (yozilayotgan)
async function loadSetup() {
  try { SETUP = await api("/api/setup"); } catch (e) { SETUP = null; }
  if (SETUP) applyName(SETUP.name);
  return SETUP;
}
function wDone(i) {
  const s = SETUP;
  return [s.token_ok && s.admins.length > 0, s.excel.found && !s.excel.error, s.refresh.ok === true, s.done][i];
}
function wCan(i) { for (let k = 0; k < i; k++) if (!wDone(k) && k !== 2) return false; return true; }  // sinovni o'tkazib yuborsa bo'ladi
function wTheme() {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("ts-theme", t); } catch (e) {}
  themeIcon(); wThemeIcon();
}
function wThemeIcon() {
  const b = $("#wTh"); if (!b) return;
  const dark = document.documentElement.dataset.theme === "dark";
  b.innerHTML = ico(dark ? "sun" : "moon", 18); b.title = dark ? "Ёруғ мавзуга ўтиш" : "Қоронғи мавзуга ўтиш"; b.setAttribute("aria-label", b.title);
}
function wInitials(t) {
  const w = String(t || "").replace(/_?bot$/i, "").split(/[\s_]+/).filter(Boolean);
  return ((w[0] || "B").charAt(0) + (w[1] || "").charAt(0)).toUpperCase();
}
async function renderSetup(step) {
  if (step !== undefined) wstep = step;
  else if (!SETUP) await loadSetup();
  if (!SETUP) { $("#view").innerHTML = '<div class="empty">Панел жавоб бермаяпти</div>'; return; }
  if (step === undefined && !SETUP.done) { wstep = [0, 1, 2].find(i => !wDone(i)); if (wstep === undefined) wstep = 3; }
  clearTimeout(wtimer);
  const s = SETUP;
  const bar = WSTEPS.map((n, i) => `<button class="s ${i === wstep ? "c" : wDone(i) ? "d" : ""}" onclick="renderSetup(${i})" ${wCan(i) ? "" : "disabled"} ${i === wstep ? 'aria-current="step"' : ""}><i></i><span>${i + 1}. ${n}</span></button>`).join("");
  const back = wstep > 0 ? `<button class="btn" onclick="renderSetup(${wstep - 1})">← Орқага</button>` : (s.done ? `<button class="btn" onclick="go('home')">← Панелга</button>` : "<span></span>");
  const body = [wStepBot, wStepData, wStepTest, wStepDone][wstep](s, back);
  wsig = wSig(s);
  $("#view").innerHTML = `<div class="wz"><div class="logo"><img src="/logo.svg" alt=""><div><b>TimeSaver</b><span>Созлаш устаси · ${wstep + 1}/${WSTEPS.length}: ${WSTEPS[wstep]}</span></div>
      <button class="ib" id="wTh" onclick="wTheme()"></button></div>
    <nav class="wsteps" aria-label="Созлаш босқичлари">${bar}</nav><div class="wcard">${body}</div></div>`;
  wThemeIcon();
  wAfter(s);
}
function wSig(s) { return JSON.stringify([wstep, s.token_ok, s.username, s.bot_title, s.admins, s.candidates.map(c => c.id), s.refresh, s.excel.path, s.excel.found]); }
function wPoll(ms) {  // fon yangilanishi: faqat o'zgarish bo'lsa qayta chiziladi (yozilayotgan matn yo'qolmaydi)
  wtimer = setTimeout(async () => {
    if (view !== "setup" || wbusy) return wPoll(ms);
    const st = wstep;
    await loadSetup();
    if (view !== "setup" || st !== wstep) return;
    if (SETUP && wSig(SETUP) !== wsig) renderSetup(wstep); else wPoll(ms);
  }, ms);
}
function wAfter(s) {
  if (wstep === 0) {
    if (s.token_ok && (!s.admins.length || !s.username)) wPoll(2500);
    const t = $("#wTok"); if (t && !s.token_ok && !wtok.busy) t.focus();
  } else if (wstep === 1) {
    const d = $("#wDrop");
    d.ondragover = e => { e.preventDefault(); d.classList.add("on"); };
    d.ondragleave = () => d.classList.remove("on");
    d.ondrop = e => { e.preventDefault(); d.classList.remove("on"); if (e.dataTransfer.files[0]) wUpload(e.dataTransfer.files[0]); };
    if (wsql === null && !wsqlBusy) wSqlDetect();
  } else if (wstep === 2) {
    if (s.refresh.running) wPoll(1500);
  }
}

async function wToken() {

async function wAdmin(id) {

async function wNext0() {

function wCopy(t) {
  const done = () => toast("Нусхаланди: " + t);
  try { navigator.clipboard.writeText(t).then(done, () => wCopyOld(t, done)); } catch (e) { wCopyOld(t, done); }
}
function wCopyOld(t, done) {
  const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand("copy"); done(); } catch (e) {} a.remove();
}

      <div class="g2"><div class="f"><label for="wSrv">SQL сервер</label><input class="inp" id="wSrv" list="wSrvList" value="${esc(wsf.server)}" oninput="wsf.server=this.value.trim()" placeholder="Масалан: .\\SQLEXPRESS ёки SERVER01" autocomplete="off">

function wPickDb(dbs) {  // tanlanadigan baza: saqlangani > formadagi > birinchisi
  return [SETUP.sql.database, wsf.db].find(d => d && dbs.includes(d)) || dbs[0] || "";
}
async function wSqlDetect() {
  wsqlBusy = true; if (wstep === 1) renderSetup(1);
  let r;
  try { r = await api("/api/setup/sql_detect", {}); } catch (e) { r = {ok: false, error: "Панел жавоб бермади"}; }
  wsqlBusy = false; wsql = r;
  if (r.ok) { wsf.server = r.server; wsf.dbs = r.databases || []; wsf.db = wPickDb(wsf.dbs); if (r.uid) wsf.uid = r.uid; }
  else if (!wsf.server && r.server) wsf.server = r.server;
  if (view === "setup" && wstep === 1) renderSetup(1);
}
async function wSqlCheck() {
  if (!wsf.server) { toast("SQL сервер номини киритинг", true); $("#wSrv").focus(); return; }
  wsqlBusy = true; renderSetup(1);
  let r;
  try { r = await api("/api/setup/sql_dbs", {server: wsf.server, uid: wsf.uid.trim(), pwd: wsf.pwd}); } catch (e) { r = {ok: false, error: "Панел жавоб бермади"}; }
  wsqlBusy = false;
  const cands = (wsql && wsql.candidates) || [];
  wsql = r.ok ? {ok: true, server: wsf.server, databases: r.databases, candidates: cands} : {ok: false, error: r.error, detail: r.detail, candidates: cands};
  if (r.ok) { wsf.dbs = r.databases; wsf.db = wPickDb(wsf.dbs); }
  else wsf.dbs = [];  // ulanmadi — baza nomi qo'lda yoziladi
  renderSetup(1);
}
async function wSql() {
  if (!wsf.server || !wsf.db) { toast("Сервер ва база номини киритинг", true); return; }
  const r = await wPost({sql: {server: wsf.server, database: wsf.db, uid: wsf.uid.trim(), pwd: wsf.pwd, test: true}});
  if (r && !r.ok && r.detail) { wsql = {ok: false, error: r.error, detail: r.detail, candidates: (wsql && wsql.candidates) || []}; renderSetup(1); }
}
async function wPost(body, next, excel) {
  wbusy = true;
  try {
    const r = await api("/api/setup", body);
    if (excel) wxErr = r.ok ? null : r;
    toast(r.ok ? r.msg : r.error, !r.ok);
    await loadSetup();
    renderSetup(r.ok && next !== undefined ? next : wstep);
    return r;
  } finally { wbusy = false; }
}
async function wPath() { const p = $("#wPath").value.trim(); if (!p) return; const r = await wPost({excel_path: p}, undefined, true); }
function wUpload(f) {
  if (!f) return;
  if (!/\.(xlsm|xlsx)$/i.test(f.name)) { toast("Фақат .xlsm ёки .xlsx файл", true); return; }
  const pr = $("#wProg"), x = new XMLHttpRequest();
  pr.style.display = "block"; wbusy = true;
  x.open("POST", "/api/setup/upload");
  x.setRequestHeader("X-Requested-With", "panel");
  x.setRequestHeader("X-File-Name", encodeURIComponent(f.name));
  x.upload.onprogress = e => { if (e.lengthComputable) pr.firstChild.style.width = (e.loaded / e.total * 100) + "%"; };
  x.onload = async () => {
    let r = {ok: false, error: "Жавоб ўқилмади"};
    try { r = JSON.parse(x.responseText); } catch (e) {}
    wbusy = false; wxErr = r.ok ? null : r;
    toast(r.ok ? r.msg : r.error, !r.ok);
    await loadSetup(); renderSetup(1);
  };
  x.onerror = () => { wbusy = false; pr.style.display = "none"; toast("Юклашда хато", true); };
  x.send(f);
}

/* --- 3. Sinov --- */
function wStepTest(s, back) {
  const r = s.refresh, steps = r.steps || {}, rows = s.excel.rows || {};
  let waiting = false;
  const cards = SHEETS.map(k => {
    const st = steps[k];
    let cls = "", ic = "◻️", val = "—", note = r.running ? "кутмоқда" : "";
    if (st && st[0] === "ok") { cls = "ok"; ic = "✅"; val = st[1] ? Number(st[1]).toLocaleString("ru-RU") : (rows[k] || 0).toLocaleString("ru-RU"); note = "қатор"; }
    else if (st && st[0] === "err") { cls = "err"; ic = "❌"; note = st[1]; }
    else if (r.running && !waiting) { waiting = true; cls = "run"; ic = "⏳"; note = "жараёнда…"; }
    else if (!r.running && r.ok === null && rows[k] !== undefined) { val = rows[k].toLocaleString("ru-RU"); note = "ҳозирги файлда"; }
    return `<div class="sheet ${cls}"><small>${ic} ${esc(SHEET_LBL[k] || k)}</small><b>${esc(val)}</b><em>${esc(note)}</em></div>`;
  }).join("");
  const res = r.running ? `<div class="wwait"><i class="spin"></i>Янгиланмоқда… одатда 1–3 дақиқа. Бу вақтда Excel'ни очманг.</div>`
    : r.ok === true ? `<div class="okline">✅ Синов ўтди: ${esc(r.msg || "маълумот янгиланди")}</div>`
    : r.ok === false ? `<div class="errline">❌ ${esc(r.msg || "Янгилаш бажарилмади")}</div><div class="hint">Excel ўрнатилганини ва SQL созламасини текширинг (<a href="#setup" onclick="renderSetup(1);return false">2-қадам</a>), кейин қайта синанг.</div>` : "";
  return `<h3>Синов</h3><p class="lead">«Янгилаш»ни бир марта ишга тушириб кўрамиз: Excel яширин очилади, макрос SQL базадан маълумот олади ва бот янги маълумотни ўқийди. Компьютерда Microsoft Excel бўлиши керак.</p>
    ${s.sql.exists ? "" : `<div class="notice warn card" style="margin-bottom:0">SQL созланмаган — синов ўтмаслиги мумкин. <a href="#setup" onclick="renderSetup(1);return false">SQL'ни созлаш</a></div>`}
    <div class="wopen"><button class="btn ${r.ok === true ? "" : "primary"} big" onclick="wRefresh()" ${r.running ? "disabled" : ""}>${r.running ? "Синов кетмоқда…" : r.ok === null ? "Синовни бошлаш" : "Қайта синаш"}</button></div>
    ${res}
    <div class="sheets" style="--n:${SHEETS.length}">${cards}</div>
    <div class="wnav">${back}<button class="btn ${r.ok === true ? "primary" : ""}" onclick="renderSetup(3)" ${r.running ? "disabled" : ""}>${r.ok === true ? "Давом этиш →" : "Ўтказиб юбориш →"}</button></div>`;
}
async function wRefresh() {
  const r = await api("/api/refresh", {});
  if (!r.ok) toast(r.error, true);
  await loadSetup(); renderSetup(2);
}

      ${row(s.admins.length > 0, "Админлар", s.admins.length ? s.admins_info.map(a => esc(a.name || String(a.id))).join(", ") : "йўқ")}
      ${row(s.sql.exists, "SQL база", s.sql.exists ? esc(s.sql.server + " / " + s.sql.database) : "созланмаган", s.sql.exists ? (s.sql.uid ? "логин орқали" : "Windows орқали") : "«Янгилаш» ишламайди")}
      ${row(x.found && !x.error, "Excel файл", x.found ? esc(fname) : "юкланмаган", x.found && !x.error ? `сотув ${(x.rows.Sale || 0).toLocaleString("ru-RU")} · срок ${(x.rows.Srok || 0).toLocaleString("ru-RU")} қатор` : "")}
      ${row(s.refresh.ok === true, "Синов", s.refresh.ok === true ? "ўтди" : s.refresh.ok === false ? "ўтмади" : "ўтказилмади", s.refresh.ok === true ? "" : "кейин «Янгилаш» тугмаси билан синаш мумкин")}
    </div>
    <div class="hint" style="margin-top:12px">Маълумот папкаси: ${esc(s.data_dir)} · ${esc(s.brand)} ${esc(s.version)}</div>
    <div class="wnav">${back}<button class="btn primary big" onclick="wFinish()" ${ready ? "" : "disabled"}>Панелни очиш →</button></div>`;
}
async function wFinish() {
  if (!SETUP.done) {
    const r = await api("/api/setup", {finish: true});
    toast(r.ok ? r.msg : r.error, !r.ok);
    if (!r.ok) return;
    await loadSetup();
  }
  go("home");
}

if (location.protocol === "file:") {
  $("#view").innerHTML = `<div class="card" style="padding:26px 30px;line-height:1.8;max-width:640px">
    <b style="font-size:18px">Бу файл тўғридан-тўғри очилмайди</b><br>
    Панел TimeSaver ишлаб турганда очилади.<br>
    <b>Қандай очиш:</b> «Пуск» менюси ёки иш столидаги «TimeSaver» ёрлиғи, ёки соат ёнидаги TimeSaver иконкасини икки марта босинг.</div>`;
} else {
  ["menuBtn:menu", "colBtn:side", "setBtn:set"].forEach(x => { const [id, n] = x.split(":"); $("#" + id).innerHTML = ico(n, 18); });
  themeIcon();
  try { if (localStorage.getItem("ts-mini")) document.body.classList.add("mini"); } catch (e) {}
  loadSetup().then(() => { route(); loadState(); });
}
</script>
</body>
</html>

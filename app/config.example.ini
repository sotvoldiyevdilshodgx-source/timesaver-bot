; ===== TimeSaver sozlamalari =====
; Odatda bu faylni qo'lda o'zgartirish shart emas: hammasi panelning «Sozlash ustasi» va «Sozlamalar» bo'limida.
; Bloknot bilan ochsangiz: ; bilan boshlangan qatorlar izoh.

[app]
; Dorixona (kompaniya) nomi: panel sarlavhasida va bot xabarlarida ko'rinadi
name =
; Sozlash ustasi tugaganda yes bo'ladi
setup_done = no

[bot]
; @BotFather dan olingan token. Boshqalarga BERMANG.
token =
; Adminlarning Telegram ID raqamlari, vergul bilan
admin_ids =
; Telegram manzili (o'zgartirmang)
api_base = https://api.telegram.org

[excel]
; Bot shu Excel fayldan o'qiydi (makrosli baza_yangi.xlsm). Sozlash ustasida yuklanadi.
file =
; Varaq nomlari (faylingizdagi nom bilan bir xil bo'lsin). sheet_sale bo'sh bo'lsa, birinchi varaq olinadi.
sheet_sale =
sheet_srok = Srok
sheet_old = 30+ kun
sheet_narx = Narx
sheet_hisob = Hisob
; Sale varag'ida ma'lumot boshlanadigan qator
sale_first_row = 8
; Srok varag'idagi sklad nomi
sklad_name =

[refresh]
; «Обновить»: bot Excel faylni yashirin ochib makrosni ishga tushiradi (refresh.vbs orqali)
vbs = refresh.vbs
; Yangilash uchun maksimal vaqt (soniya)
timeout_sec = 900
; Makros yozadigan holat fayli (Excel fayl turgan papkada)
status_file = refresh_status.txt

[auto]
; Srogi N kundan kam tovarlarni firmalarga har kuni avtomatik yuborish
enabled = no
srok_days = 90
time = 09:00
stale_hours = 72

[order]
; Buyurtma = (sotuv * cover) - jami qoldiq
cover = 1

[fom]
; fayl — bron Excel fayl sifatida; sql — to'g'ridan-to'g'ri SQL bazaga qoralama yoziladi
mode = fayl

[panel]
; Server paneli: http://127.0.0.1:port
port = 8765
; Bosh sahifa: «N+ кун турган» chegarasi (biror filialda N kundan ortiq turgan dorilar, qoldiq jamlanadi)
old_days = 90
host = 127.0.0.1
password =
